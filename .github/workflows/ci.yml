name: CI / Tests + Lint

on:
  push:
    branches:
      - master
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.11.2"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # sin cache:uv -- astral-sh/setup-uv@v2 (paso anterior) ya cachea
          # (UV_CACHE_DIR); redundante aqui rompe con "Caching for 'uv' is
          # not supported" en este runner.

      - name: Install dependencies (uv sync)
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check src/ tests/

      - name: Run tests
        run: uv run python -m unittest discover tests -v

      - name: Architecture check
        run: |
          uv run python tests/test_architecture.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.11.2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ver nota arriba (job test): sin cache:uv redundante

      - name: Build wheel + sdist (uv build)
        run: |
          uv build
          ls -lh dist/

      - name: Install wheel in clean venv and smoke-test
        run: |
          python3 -m venv /tmp/pdfsum-smoke
          /tmp/pdfsum-smoke/bin/pip install dist/pdfsum-*.whl
          /tmp/pdfsum-smoke/bin/pdfsum --help
          /tmp/pdfsum-smoke/bin/pdfsum doctor || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pdfsum-ci .

      - name: Smoke test - help and doctor
        run: |
          docker run --rm pdfsum-ci pdfsum --help
          docker run --rm pdfsum-ci pdfsum doctor || true

      # Ejercita el fallback de OCR por región / Pillow, ver criterio C2
      # en evals/eval-spec-fase13-docker-ollama-runtime.yaml
      - name: Smoke test - transcribe muestra
        run: |
          mkdir -p /tmp/ci-in /tmp/ci-out /tmp/ci-logs
          cp samples/pdfs/*.pdf /tmp/ci-in/
          docker run --rm \
            -v /tmp/ci-in:/input:ro -v /tmp/ci-out:/output \
            -v /tmp/ci-logs:/logs \
            pdfsum-ci pdfsum transcribe --in /input \
            --workspace /output --lang por
          test -n "$(ls -A /tmp/ci-out/ocr)" \
            || (echo "sin salida OCR" && exit 1)

      - name: Validate compose.yml (default + gpu profile)
        run: |
          docker compose config >/dev/null
          docker compose --profile gpu config >/dev/null

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.11.2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # ver nota arriba (job test): sin cache:uv redundante

      - name: Check INSTALL.md and README.md exist
        run: |
          test -f INSTALL.md || (echo "INSTALL.md missing" && exit 1)
          test -f README.md || (echo "README.md missing" && exit 1)
          echo "✅ Documentation files found"

      - name: Verify uv.lock is consistent
        run: |
          uv sync --locked
          echo "✅ uv.lock is consistent"
