[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdfsum"
version = "0.14.0"
description = "Motor de resúmenes estructurados de documentos PDF (local, sin API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "INFOMED / BIREME" }]
keywords = ["ocr", "resumen", "pdf", "lilacs", "bireme", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: General",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Dependencia Python obligatoria: Pillow. La usa en runtime real
# adapters/hybrid_ocr.py (fallback de OCR por región cuando el VLM no
# está disponible), no solo los tests. Fase 13 (FASE13-DOCKER-OLLAMA-RUNTIME):
# antes vivía solo en [dependency-groups].dev y por eso `pip install .`
# (p.ej. dentro del Dockerfile) no la instalaba -> ModuleNotFoundError en
# producción. El resto del núcleo sigue siendo solo stdlib. Los requisitos
# de SISTEMA (poppler, tesseract) y de MODELOS (Ollama + qwen2.5:7b /
# qwen3-vl:8b) siguen fuera de pip — ver INSTALL.md y `pdfsum doctor`.
dependencies = ["pillow>=10"]

[dependency-groups]
# ruff: NUNCA estuvo declarado (solo configurado en [tool.ruff] abajo).
# `uv run ruff` funcionaba en dev por accidente (ruff instalado global en
# la máquina, `uv run` cae a PATH si el venv no lo tiene) pero fallaba en
# CI (runner limpio, sin ruff global): "Failed to spawn: ruff". Declararlo
# aquí hace que `uv sync` lo instale en el venv del proyecto siempre.
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "hatchling>=1.24",
  "hypothesis>=6.100",
  "pyyaml>=6",
  "ruff>=0.16",
  "tomli>=2; python_version < '3.11'",
]
mutation = ["mutmut>=3.0"]

[project.scripts]
pdfsum = "pdfsum.cli:main"

[project.urls]
Homepage = "https://github.com/idourra/pdf-summarizer"
Repository = "https://github.com/idourra/pdf-summarizer"
Issues = "https://github.com/idourra/pdf-summarizer/issues"
Changelog = "https://github.com/idourra/pdf-summarizer/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsum"]

[tool.hatch.build.targets.sdist]
# Excluir datos de muestra/artefactos generados: no forman parte del
# paquete distribuible, solo del repo de desarrollo.
exclude = [
  "samples/pdfs",
  "data_hierarchical",
  "data/ocr",
  "entregable",
]

[tool.ruff]
line-length = 88

[tool.coverage.run]
branch = true
source = ["src/pdfsum"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mutmut]
source_paths = ["src/pdfsum"]
only_mutate = [
  "src/pdfsum/segment.py",
  "src/pdfsum/qa.py",
  "src/pdfsum/ocr_routing.py",
  "src/pdfsum/pipeline.py",
  "src/pdfsum/adapters/pdf_batch.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_batch_pdf.py",
  "tests/test_ocr_routing.py",
  "tests/test_pipeline_fase1.py",
  "tests/test_pipeline_hierarchical.py",
  "tests/test_qa.py",
  "tests/test_segment.py",
]
mutate_only_covered_lines = true
