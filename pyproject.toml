[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdfsum"
version = "0.12.0"
description = "Motor de resúmenes estructurados de documentos PDF (local, sin API)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "INFOMED / BIREME" }]
keywords = ["ocr", "resumen", "pdf", "lilacs", "bireme", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: General",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Sin dependencias Python obligatorias: el núcleo usa solo la stdlib.
# Los requisitos externos son de SISTEMA (poppler, tesseract) y de MODELOS
# (Ollama + qwen2.5:7b / qwen3-vl:8b). Ver INSTALL.md y `pdfsum doctor`.
dependencies = []

[dependency-groups]
# Solo para tests (generación de imágenes sintéticas en
# test_segment.py / test_hybrid_ocr.py / test_hybrid_seg.py).
# No es dependencia de runtime del paquete.
dev = ["pillow>=10"]

[project.scripts]
pdfsum = "pdfsum.cli:main"

[project.urls]
Homepage = "https://github.com/idourra/pdf-summarizer"
Repository = "https://github.com/idourra/pdf-summarizer"
Issues = "https://github.com/idourra/pdf-summarizer/issues"
Changelog = "https://github.com/idourra/pdf-summarizer/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsum"]

[tool.hatch.build.targets.sdist]
# Excluir datos de muestra/artefactos generados: no forman parte del
# paquete distribuible, solo del repo de desarrollo.
exclude = [
  "samples/pdfs",
  "data_hierarchical",
  "data/ocr",
  "entregable",
]

[tool.ruff]
line-length = 88
